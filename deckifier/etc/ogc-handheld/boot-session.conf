# Session started automatically on boot (SDDM autologin):
#   last     -> the last mode used, like SteamOS (default):
#               Game Mode, or Desktop only if you switched to it
#               permanently (steamos-session-select plasma-persistent)
#   desktop  -> always KDE Plasma (Wayland)
#   gamemode -> always Steam Game Mode (gamescope)
BOOT_SESSION=last
